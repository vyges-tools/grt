# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# Two jobs, because the crate has two faces:
#   - `lib`: the default features, no C++ — the guide rules and the router's stages are pure and
#     tested against the JSON corpora in examples/ and tests/data/.
#   - `cli`: the `vyges-grt` engine, which reads and writes the design database through
#     vyges-opendb, which statically links libodb (C++, built from source).
#
# ⚠️ Every `[patch]` path in Cargo.toml must resolve, even for features that are off: a patch
# whose path is missing is a hard `failed to load source`, not a fall-back to the git source.
# Hence all six sibling checkouts in both jobs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lib:
    name: library (no C++)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-grt
    steps:
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-grt
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/est
          path: vyges-tools-est
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/sta
          path: vyges-tools-sta
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/dpl
          path: vyges-tools-dpl
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/loom
          path: vyges-tools-loom
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/layout
          path: vyges-tools-layout
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --verbose

  cli:
    name: engine (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-grt
    steps:
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-grt
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/est
          path: vyges-tools-est
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/sta
          path: vyges-tools-sta
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/dpl
          path: vyges-tools-dpl
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/loom
          path: vyges-tools-loom
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/layout
          path: vyges-tools-layout

      - name: Toolchain
        # Boost (headers) + zlib only; fmt/spdlog/abseil are built from source by libodb's build.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      # No --locked: Cargo.lock is gitignored, and the [patch] resolves the sibling crates to the
      # freshly checked-out repos @ main — let Cargo resolve.
      - name: Build
        run: cargo build --release --features cli --verbose
      - name: Test
        run: cargo test --release --features cli --verbose
      - name: Smoke the contract
        run: |
          ./target/release/vyges-grt --version
          ./target/release/vyges-grt --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["name"]=="grt" and len(d["openroad_pin"])==40 and d["assertion"]["pass_when"]["eq"]=="routed", d'

  docs:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          "$HOME/.local/bin/mdbook" build docs
