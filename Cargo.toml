[package]
name = "vyges-grt"
version = "0.1.0"
edition = "2021"
description = "Global routing over a placed design: route guides and the congestion grid, written to the OpenDB design database."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/grt"

[features]
# The OpenDB applier. ⚠️ OFF by default, deliberately: the guide RULES are pure geometry and
# every one of them is testable without a design database, which keeps `cargo test` a
# second-long, dependency-free check of the part that is easy to get wrong. Turning this on
# brings in the database and its C++ build.
#
# ⛔ It must pull in `gen-write` too: `net_clear_guides` is a GENERATED setter and the database
# crate keeps its whole generated write surface behind that feature. Depending on the crate
# without it compiles the read half only, and the applier needs to clear before it writes.
odb = ["dep:vyges-opendb", "vyges-opendb/gen-write", "vyges-est/odb", "dep:vyges-sta"]
# The `vyges-grt` command: the database, plus the Steiner-tree engine the router calls for real
# (R5/R7 take it as an injected function) and JSON for the job file and the report.
# `repair_antennas` legalizes the diodes it inserts with the detailed placer, as the reference's
# `legalizePlacedCells` calls `opendp_->detailedPlacement`.
cli = ["odb", "dep:vyges-stt", "dep:serde_json", "dep:flate2", "dep:vyges-dpl"]

[dev-dependencies]
# Test-only: the end-to-end corpus is JSON. The library itself stays dependency-free.
serde_json = "1"
# Test-only: the router's own flute path (R5/R7) calls the Steiner-tree engine's pre-sorted FLUTE;
# the library takes that call as an injected function until the sequencer wiring links it for real.
vyges-stt = { git = "https://github.com/vyges-tools/stt.git", branch = "main" }

[dependencies]
# The parasitic estimator (`est`): the router builds its partial-slack networks with it, as the
# reference's grt links est. Itself dependency-free.
vyges-est = { git = "https://github.com/vyges-tools/est.git", branch = "main" }
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", optional = true }
vyges-stt = { git = "https://github.com/vyges-tools/stt.git", branch = "main", optional = true }
serde_json = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
vyges-dpl = { git = "https://github.com/vyges-tools/dpl.git", branch = "main", optional = true }
# The timer the router reads its net slacks from (a clock defined, no captured slacks).
vyges-sta = { git = "https://github.com/vyges-tools/sta.git", branch = "main", optional = true }

# Local development against the sibling checkouts. Patches are only honored from the root
# manifest, so this is a no-op for downstream consumers pulling us by git.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[patch."https://github.com/vyges-tools/est.git"]
vyges-est = { path = "../vyges-tools-est" }

[patch."https://github.com/vyges-tools/sta.git"]
vyges-sta = { path = "../vyges-tools-sta" }

[patch."https://github.com/vyges-tools/dpl.git"]
vyges-dpl = { path = "../vyges-tools-dpl" }

[patch."https://github.com/vyges-tools/loom.git"]
vyges-loom = { path = "../vyges-tools-loom" }

[patch."https://github.com/vyges-tools/layout"]
vyges-layout = { path = "../vyges-tools-layout" }

[lib]
name = "vyges_grt"
path = "src/lib.rs"

[[bin]]
name = "vyges-grt"
path = "src/bin/vyges-grt.rs"
required-features = ["cli"]
